<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Panel de control · Overty</title>
<style>
:root{--navy:#12263d;--navy2:#0d1d30;--blue:#4a90d2;--blue2:#6fa8dd;--ink:#eaf2fb;--ink2:#9db6d0;--line:rgba(255,255,255,.12);--ok:#3fd07f;--warn:#f0b24a;--red:#ff6b61;--field:rgba(255,255,255,.07)}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif}
html,body{height:100%}
body{background:linear-gradient(165deg,#163150,#0c1a2c);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;overflow:auto}
.wrap{min-height:100vh;padding:26px 30px;display:flex;flex-direction:column;gap:18px;max-width:720px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px}
.logo{font-size:22px;font-weight:800;display:flex;align-items:center}.logo .m{color:#fff}.logo .b{color:var(--blue2)}.logo .ring{width:11px;height:11px;border:3px solid var(--blue2);border-radius:50%;margin:7px 0 0 3px}
.top h1{font-size:14px;font-weight:600}.top small{display:block;font-size:12px;color:var(--ink2)}
.top .firma{margin-left:auto;font-size:12px;color:var(--ink2)}.top .firma b{color:#fff}
.card{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:18px;padding:22px 24px;display:flex;flex-direction:column;gap:14px}
h2{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
label{font-size:12px;color:var(--ink2);font-weight:600;margin-bottom:5px;display:block}
input,textarea{width:100%;background:var(--field);border:1px solid var(--line);border-radius:11px;padding:11px 13px;color:var(--ink);font:500 14px "Segoe UI",sans-serif;outline:0}
input:focus,textarea:focus{border-color:var(--blue)}
textarea{resize:vertical;min-height:52px}
.btn{border:0;border-radius:11px;padding:13px 20px;font:600 14px "Segoe UI",sans-serif;cursor:pointer;color:#fff;background:linear-gradient(180deg,var(--blue),#3a7fc0)}
.btn:disabled{opacity:.5;cursor:default}
.btn.g{background:var(--field);border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.msg{font-size:13px;min-height:18px}.msg.ok{color:var(--ok)}.msg.err{color:var(--red)}
/* interruptor */
.sw{display:flex;align-items:center;gap:14px;padding:16px;border:1px solid var(--line);border-radius:14px;background:var(--field)}
.sw .t b{font-size:15px}.sw .t span{display:block;font-size:12px;color:var(--ink2)}
.tg{margin-left:auto;width:62px;height:34px;border-radius:99px;background:rgba(255,255,255,.14);cursor:pointer;position:relative;transition:.3s;flex:none}
.tg.on{background:linear-gradient(180deg,#45d682,#2bbf6a)}
.tg i{position:absolute;top:3px;left:3px;width:28px;height:28px;border-radius:50%;background:#fff;transition:.3s}
.tg.on i{left:31px}
.estado-chip{font-size:12px;font-weight:700;padding:5px 12px;border-radius:99px}
.on-c{background:rgba(63,208,127,.16);color:var(--ok)}.off-c{background:rgba(255,107,97,.16);color:var(--red)}
.hint{font-size:12px;color:var(--ink2);line-height:1.5}
.foot{font-size:11px;color:var(--ink2);text-align:center}
.isoact{display:flex;align-items:center;gap:12px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--field)}
.isoact .ic{width:38px;height:38px;border-radius:10px;background:linear-gradient(145deg,var(--blue),#24507a);display:grid;place-items:center;font-weight:800;color:#fff;flex:none;font-size:12px}
.isoact b{font-size:14px} .isoact span{display:block;font-size:12px;color:var(--ink2)}
.bar{height:12px;border-radius:99px;background:rgba(255,255,255,.12);overflow:hidden;margin-top:10px}
.bar .fill{height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));width:0;transition:width .3s;border-radius:99px}
details{border:1px solid var(--line);border-radius:12px;padding:0 14px;background:var(--field)}
details summary{cursor:pointer;padding:12px 0;font-size:13px;color:var(--ink2);font-weight:600}
details[open]{padding-bottom:14px}
details .g3{display:flex;flex-direction:column;gap:10px}
.big-btn{display:flex;align-items:center;justify-content:center;gap:10px;padding:15px;font-size:15px}
</style></head>
<body><div class="wrap">
 <div class="top"><div class="logo"><span class="m">Main</span><span class="b">bit</span><i class="ring"></i></div>
   <div><h1>Panel de control · Overty</h1><small>Solo para ti · activa, desactiva y cambia el ISO</small></div>
   <div class="firma" id="firma"></div></div>
 <div id="vista"></div>
 <div class="foot">© 2026 <span id="firma2"></span> · Panel v<span id="ver"></span> · repo <span id="repo"></span></div>
</div>
<script>
const api=()=>window.pywebview.api;let S={};
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=document.getElementById('vista');
const val=id=>document.getElementById(id).value;

function render(){
  document.getElementById('firma').innerHTML='Sesión de <b>'+esc(S.firma)+'</b>';
  document.getElementById('firma2').textContent=S.firma||'';
  document.getElementById('ver').textContent=S.version||'';
  document.getElementById('repo').textContent=S.repo||'';
  if(!S.entrado) return login();
  return panel();
}

function login(){
  el.innerHTML=`<div class="card">
    <h2>Entrar</h2>
    <div class="hint">Escribe tu PIN. ${S.hay_token?'Tu token de GitHub ya está guardado cifrado en este equipo.':'La primera vez, pega también tu <b>token de GitHub</b> (con permiso <b>repo</b>); se guardará cifrado con tu PIN.'}</div>
    <div><label>PIN</label><input id="pin" type="password" autocomplete="off"></div>
    ${S.hay_token?'':'<div><label>Token de GitHub (ghp_…)</label><input id="tok" type="password" autocomplete="off" placeholder="ghp_xxxxxxxx"></div>'}
    <div class="row"><div class="msg err" id="msg">${esc(S.msg||'')}</div>
      <button class="btn" style="margin-left:auto" onclick="entrar()">Entrar</button></div>
    ${S.hay_token?'<div class="hint">¿Cambiar de token? Borra el archivo cfg.bin en %APPDATA%\\\\OvertyPanel.</div>':''}
  </div>`;
}

function entrar(){const pin=val('pin');const tok=document.getElementById('tok')?val('tok'):'';if(!pin)return;api().entrar(pin,tok)}

function panel(){
  const c=S.control||{activo:true,mensaje:'',iso:{}};const iso=c.iso||{};
  const tieneIso=!!(iso.url);
  const msgCls=/✔/.test(S.msg||'')?'ok':(S.msg?'err':'');
  el.innerHTML=`
   <div class="card">
    <div class="row"><h2 style="margin:0">Estado del servicio</h2>
      <span class="estado-chip ${c.activo?'on-c':'off-c'}" style="margin-left:auto">${c.activo?'ACTIVO':'DESACTIVADO'}</span></div>
    <div class="sw"><div class="t"><b>Permitir crear USBs</b><span>Si lo apagas, la app de los técnicos deja de funcionar.</span></div>
      <div class="tg ${c.activo?'on':''}" id="tg" onclick="toggle()"><i></i></div></div>
    <div><label>Mensaje cuando está desactivado</label><textarea id="mensaje">${esc(c.mensaje||'')}</textarea></div>
    <div class="row"><div class="msg ${msgCls}" id="msg">${esc(S.msg||'')}</div>
      <button class="btn" style="margin-left:auto" id="gsave" onclick="guardar()">Guardar estado</button></div>
   </div>
   <div class="card">
    <h2>ISO que usan los técnicos</h2>
    <div class="isoact"><div class="ic">ISO</div>
      <div><b>${tieneIso?esc(iso.nombre||'Overty Disk'):'Todavía no has subido ningún ISO'}</b>
       <span>${tieneIso?('En uso'+(iso.subido?' · subido '+esc(iso.subido):'')):'Los técnicos no podrán crear USB hasta que subas uno.'}</span></div></div>
    ${S.subiendo?`<div><div class="row"><span style="font-size:13px;color:var(--ink2)">${esc(S.etapa||'Subiendo…')}</span>
        <b style="margin-left:auto;color:#fff">${Math.round(S.pct||0)}%</b></div>
        <div class="bar"><div class="fill" style="width:${S.pct||0}%"></div></div></div>`
     :`<button class="btn big-btn" onclick="subir()">⬆  Subir ISO nuevo…</button>`}
    <div class="hint">Elige el .iso ya corregido (el de tu script). Se sube a tu repositorio, se calcula su huella y se publica solo. Cuando cambien de proveedor de borrado, solo sube el nuevo.</div>
    <details ${tieneIso?'':''}>
      <summary>Opción avanzada: usar un ISO que ya está en otro lado (OneDrive…)</summary>
      <div class="g3">
        <div><label>Nombre visible</label><input id="iso_nombre" value="${esc(iso.nombre||'')}" placeholder="Overty Disk (USB fix)"></div>
        <div><label>URL de descarga directa</label><input id="iso_url" value="${esc(iso.url||'')}" placeholder="https://…/overty-usbfix.iso"></div>
        <div><label>SHA-256 (opcional)</label><input id="iso_sha" value="${esc(iso.sha256||'')}"></div>
        <button class="btn g" onclick="usarUrl()">Usar este enlace</button>
      </div>
    </details>
   </div>`;
}

function toggle(){const c=S.control;c.activo=!c.activo;document.getElementById('tg').classList.toggle('on',c.activo);
  const chip=document.querySelector('.estado-chip');chip.className='estado-chip '+(c.activo?'on-c':'off-c');chip.textContent=c.activo?'ACTIVO':'DESACTIVADO';}
function guardar(){const c=S.control;document.getElementById('gsave').disabled=true;document.getElementById('msg').textContent='Guardando…';
  api().guardar_estado({activo:c.activo,mensaje:val('mensaje')}).then(()=>{});}
function subir(){api().elegir_y_subir_iso().then(()=>{});}
function usarUrl(){api().usar_url(val('iso_nombre'),val('iso_url'),val('iso_sha')).then(()=>{});}

async function latir(){try{const n=await api().snapshot();S=n;render()}catch(e){}}
window.addEventListener('pywebviewready',()=>{latir();setInterval(()=>{if(!document.activeElement||['BODY','DIV'].includes(document.activeElement.tagName))latir()},1200)});
setTimeout(()=>{if(window.pywebview)latir()},300);
</script>
</body></html>
