<!doctype html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Creador de USB · Overty</title>
<style>
:root{
  --navy:#1b3b5a; --navy2:#122b43; --blue:#4a90d2; --blue2:#6fa8dd; --sky:#dceb;
  --bg:#eef3f9; --card:#ffffff; --ink:#16304a; --ink2:#6b84a0; --line:#e4ecf5;
  --ok:#2ea86a; --warn:#e0922a; --red:#d14b43;
}
*{box-sizing:border-box;margin:0;font-family:"Segoe UI Variable Display","Segoe UI",Inter,system-ui,sans-serif}
html,body{height:100%}
body{background:linear-gradient(160deg,#f3f7fc,#e6eef7);color:var(--ink);-webkit-font-smoothing:antialiased;user-select:none;overflow:hidden}
.wrap{height:100vh;display:flex;flex-direction:column;padding:22px 26px;gap:16px}
/* ---- encabezado con logo Mainbit ---- */
.top{display:flex;align-items:center;gap:14px}
.brand{background:#fff;border-radius:12px;padding:8px 13px;display:inline-flex;align-items:center;box-shadow:0 2px 8px -3px rgba(20,50,80,.25)}
.brand img{height:26px;display:block}
.top .sep{width:1px;height:30px;background:var(--line)}
.top h1{font-size:15px;font-weight:600;color:var(--ink)}
.top small{display:block;font-size:12px;color:var(--ink2);font-weight:400}
.top .firma{margin-left:auto;font-size:12px;color:var(--ink2)}
.top .firma b{color:var(--navy)}
/* ---- tarjeta ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 30px -18px rgba(20,50,80,.4);
  flex:1;display:flex;flex-direction:column;overflow:hidden}
.pad{padding:26px 30px;display:flex;flex-direction:column;gap:16px;flex:1;min-height:0}
h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink2);font-weight:700}
.isochip{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--ink2);padding:10px 14px;background:#eef6ef;border:1px solid #d5e8d8;border-radius:11px}
.isochip.no{background:#fdf3e6;border-color:#f0ddc2;color:#8a6a2e}
.isochip .ck{width:20px;height:20px;border-radius:50%;background:var(--ok);display:grid;place-items:center;color:#fff;font-size:12px;flex:none}
.isochip.no .ck{background:var(--warn)}
.isochip b{color:var(--ink)}
/* ---- lista USB ---- */
.usbs{display:flex;flex-direction:column;gap:10px;overflow:auto;min-height:0;flex:1}
.usb{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;cursor:pointer;transition:.15s}
.usb:hover{border-color:var(--blue2);background:#f7fbff}
.usb.sel{border-color:var(--blue);background:#eef6ff;box-shadow:0 0 0 3px rgba(74,144,210,.15)}
.usb .dsk{width:38px;height:38px;border-radius:10px;background:#eaf2fb;display:grid;place-items:center;flex:none}
.usb .dsk svg{width:20px;height:20px;stroke:var(--navy);fill:none;stroke-width:1.8}
.usb b{font-size:14px;font-weight:600} .usb span{display:block;font-size:12px;color:var(--ink2)}
.usb .gb{margin-left:auto;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.vacio{color:var(--ink2);font-size:13px;padding:30px;text-align:center;border:1.5px dashed var(--line);border-radius:14px}
/* ---- botones ---- */
.btn{border:0;border-radius:12px;padding:14px 22px;font:600 14px/1 "Segoe UI",Inter,sans-serif;cursor:pointer;color:#fff;
  background:linear-gradient(180deg,var(--blue),#3a7fc0);box-shadow:0 8px 18px -8px rgba(58,127,192,.7)}
.btn:disabled{opacity:.45;cursor:default;box-shadow:none}
.btn.g{background:none;color:var(--ink2);box-shadow:none;border:1px solid var(--line)}
.row{display:flex;gap:12px;align-items:center}
.aviso{font-size:12px;color:var(--ink2)}
/* ---- progreso ---- */
.prog .bar{height:14px;border-radius:99px;background:#e7eef7;overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--navy));width:0;transition:width .3s;border-radius:99px}
.prog .fill.indet{width:40%;animation:ind 1.1s ease-in-out infinite}
@keyframes ind{0%{margin-left:-40%}100%{margin-left:100%}}
.pct{font-size:40px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums;letter-spacing:-.03em}
.etapa{font-size:13px;color:var(--ink2)}
.log{flex:1;min-height:0;overflow:auto;background:#f6f9fc;border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  font:500 12px/1.7 "Cascadia Code",Consolas,monospace;color:var(--ink2)}
.log .e{color:var(--red)} .log .ok{color:var(--ok);font-weight:700}
/* ---- estados grandes ---- */
.full{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding:30px}
.full .em{width:72px;height:72px;border-radius:20px;display:grid;place-items:center}
.full h3{font-size:20px;font-weight:700;color:var(--navy)}
.full p{font-size:14px;color:var(--ink2);max-width:420px;line-height:1.5}
.spin{width:46px;height:46px;border:4px solid #dce7f2;border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
.foot{display:flex;align-items:center;font-size:11px;color:var(--ink2)}
.foot b{color:var(--navy)}
.tag{margin-left:auto;font-size:11px;color:var(--ink2)}
</style></head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><img src="logo.png" alt="Mainbit"></div>
    <div class="sep"></div>
    <div><h1>Creador de USB · Overty</h1><small>Deja la memoria lista para arrancar, en un clic</small></div>
    <div class="firma">Herramienta de <b id="firma">—</b></div>
  </div>
  <div class="card"><div class="pad" id="vista"></div></div>
  <div class="foot">© 2026 <b id="firma2" style="margin:0 4px">—</b> · v<span id="ver">—</span><span class="tag" id="tag"></span></div>
</div>
<script>
const api=()=>window.pywebview.api;
let S={fase:'cargando'},sel=null;
const esc=s=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const V=document.getElementById('vista');

function dskSvg(){return '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="12" cy="13" r="3.2"/><path d="M8 4v4h6"/></svg>'}

function render(){
  document.getElementById('firma').textContent=S.firma||'';
  document.getElementById('firma2').textContent=S.firma||'';
  document.getElementById('ver').textContent=S.version||'';
  const f=S.fase;
  if(f==='cargando') return V.innerHTML=`<div class="full"><div class="spin"></div><h3>Comprobando…</h3><p>Verificando la licencia y el ISO con ${esc(S.firma)}.</p></div>`;
  if(f==='sin_internet') return V.innerHTML=`<div class="full"><div class="em" style="background:#fdf0e3"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#e0922a" stroke-width="2"><path d="M1 1l22 22M8.5 16.5a5 5 0 0 1 7 0M5 13a10 10 0 0 1 3-2M2 8.8A15 15 0 0 1 20 8M12 20h.01"/></svg></div><h3>Sin conexión</h3><p>Esta herramienta necesita internet para verificar la licencia y descargar el ISO marcado por ${esc(S.firma)}.</p><button class="btn" onclick="api().reintentar()">Reintentar</button></div>`;
  if(f==='bloqueado'){const m=(S.control&&S.control.mensaje)||'Herramienta desactivada.';
    return V.innerHTML=`<div class="full"><div class="em" style="background:#fbe9e7"><svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#d14b43" stroke-width="2"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div><h3>Acceso desactivado</h3><p>${esc(m)}</p></div>`}
  if(S.ocupado||S.hecho) return vistaProgreso();
  return vistaListo();
}

function vistaListo(){
  const iso=(S.control&&S.control.iso)||{};
  const us=S.usbs||[];
  if(sel!=null && !us.some(u=>u.n===sel)) sel=null;
  V.innerHTML=`
   <div class="isochip ${iso.url?'':'no'}"><span class="ck">${iso.url?'✓':'!'}</span>
     ${iso.url?`Overty listo para grabar · <b>se descarga automáticamente</b>`:`Aún no hay un Overty disponible. Contacta a ${esc(S.firma)}.`}</div>
   <h2>Elige la memoria USB</h2>
   <div class="usbs" id="lista">${us.length?us.map(u=>`
     <div class="usb ${sel===u.n?'sel':''}" onclick="pick(${u.n})"><div class="dsk">${dskSvg()}</div>
       <div><b>${esc(u.nombre)}</b><span>Disco ${u.n} · se borrará todo su contenido</span></div><div class="gb">${u.gb} GB</div></div>`).join('')
     :`<div class="vacio">Conecta una memoria USB (8 GB o más) y aparecerá aquí.</div>`}</div>
   <div class="row"><div class="aviso">⚠ La USB que elijas se <b>borra por completo</b>.</div>
     <div style="margin-left:auto" class="row">
       <button class="btn g" onclick="api().refrescar_usb()">Actualizar</button>
       <button class="btn" id="go" ${sel==null||!iso.url?'disabled':''} onclick="crear()">Crear USB</button></div></div>`;
}

function vistaProgreso(){
  const pct=S.pct, log=S.log||[];
  const indet=pct<0;
  V.innerHTML=`
   <h2>${S.hecho?'Completado':'Creando la USB'}</h2>
   <div class="prog"><div class="row" style="justify-content:space-between;align-items:flex-end">
      <div class="pct">${indet?'•••':Math.round(pct)+'%'}</div><div class="etapa">${esc(S.etapa||'')}</div></div>
     <div class="bar" style="margin-top:10px"><div class="fill ${indet?'indet':''}" style="width:${indet?40:pct}%"></div></div></div>
   <div class="log" id="log">${log.map(l=>{const c=/^ERROR/.test(l)?'e':/^LISTO/.test(l)?'ok':'';return `<div class="${c}">${esc(l)}</div>`}).join('')}</div>
   ${S.hecho?`<div class="row"><div class="aviso" style="color:var(--ok);font-weight:600">✔ Lista. Ya puedes sacar la USB y arrancar la PC desde ella (F12, modo UEFI).</div>
      <button class="btn" style="margin-left:auto" onclick="otra()">Crear otra</button></div>`:''}`;
  const lg=document.getElementById('log'); if(lg) lg.scrollTop=lg.scrollHeight;
}

function pick(n){sel=n;render()}
function crear(){if(sel==null)return;api().crear(sel);S.ocupado=true;render()}
function otra(){sel=null;S.hecho=false;S.pct=0;S.log=[];api().refrescar_usb();render()}

let _last='',_arr=false;
async function latir(){try{const n=await api().snapshot();const j=JSON.stringify(n);if(j===_last)return;_last=j;S=n;render()}catch(e){}}
function arranca(){if(_arr)return;_arr=true;latir();setInterval(latir,1000)}
window.addEventListener('pywebviewready',arranca);
setTimeout(()=>{if(window.pywebview)arranca()},400);
</script>
</body></html>
