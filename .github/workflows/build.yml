name: Compilar Creador y Panel (Overty)
on:
  push:
    branches: [main]
    paths: ["**.py", "assets/**", "build/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller cryptography pillow

      - name: Iconos y versión (firma Gabriel HernArro)
        shell: pwsh
        run: |
          python build/hacer_icono.py icono_creador.ico
          python build/hacer_icono.py icono_panel.ico panel
          python build/hacer_version.py creador
          python build/hacer_version.py panel

      - name: Captura de prueba (verifica que las interfaces se ven y arrancan)
        shell: pwsh
        run: |
          $env:MB_SHOT = "shot_creador.png"; python crear_usb.py --autotest
          $env:MB_SHOT = "shot_panel.png";   python panel_control.py --autotest
          if (!(Test-Path shot_creador.png) -or !(Test-Path shot_panel.png)) { Write-Host "::warning::No se generó alguna captura" }

      - name: Subir capturas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: capturas
          path: shot_*.png
          if-no-files-found: warn

      - name: Descargar Ventoy (para el modo Ventoy del Creador)
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/ventoy/Ventoy/releases/latest" -Headers @{Authorization="Bearer ${{ github.token }}"}
          $asset = $rel.assets | Where-Object { $_.name -match 'windows\.zip$' } | Select-Object -First 1
          Invoke-WebRequest $asset.browser_download_url -OutFile ventoy.zip
          Expand-Archive ventoy.zip -DestinationPath ventoy_dl -Force
          $dir = (Get-ChildItem ventoy_dl -Directory | Select-Object -First 1).FullName
          "VENTOY_DIR=$dir" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "Ventoy: $($asset.name) -> $dir"

      - name: Compilar Creador de USB
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin `
            --name MainbitCreadorUSB --icon icono_creador.ico --version-file ver_creador.txt `
            --add-data "assets;assets" --add-data "$env:VENTOY_DIR;ventoy" crear_usb.py

      - name: Compilar Panel de control
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name PanelControlOverty --icon icono_panel.ico --version-file ver_panel.txt `
            --collect-all cryptography --add-data "assets;assets" panel_control.py

      - name: Lanzador .bat (el .exe ya pide permiso de administrador solo)
        shell: pwsh
        run: |
          $lineas = @(
            '@echo off',
            'title Creador de USB Overty',
            'start "" "%~dp0MainbitCreadorUSB.exe"'
          )
          Set-Content -Path "dist\MainbitCreadorUSB\CREAR_USB_OVERTY.bat" -Value $lineas -Encoding ascii

      - name: Empaquetar
        shell: pwsh
        run: |
          Copy-Item LEEME-TECNICOS.txt dist\MainbitCreadorUSB\LEEME.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\MainbitCreadorUSB\* -DestinationPath MainbitCreadorUSB.zip -Force
          Compress-Archive -Path dist\PanelControlOverty\* -DestinationPath PanelControlOverty.zip -Force

      - name: Publicar en Releases (Windows)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Creador y Panel de Overty (última versión)"
          files: |
            MainbitCreadorUSB.zip
            PanelControlOverty.zip
            shot_creador.png
            shot_panel.png

  mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias
        run: python -m pip install --upgrade pyinstaller pywebview cryptography

      - name: Prueba de arranque (no bloquea)
        run: |
          python mac/panel_mac.py --autotest || echo "::warning::panel mac: arranque no concluyente en CI"
          python mac/crear_mac.py --autotest || echo "::warning::creador mac: arranque no concluyente en CI"

      - name: Compilar Panel (Mac · Liquid Glass)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Panel Overty" \
            --collect-all webview --collect-all cryptography \
            --add-data "mac/web:web" mac/panel_mac.py

      - name: Compilar Creador (Mac · Liquid Glass)
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name "Creador USB Overty" \
            --collect-all webview \
            --add-data "mac/web:web" mac/crear_mac.py

      - name: Empaquetar .app
        run: |
          ditto -c -k --keepParent "dist/Panel Overty.app" "PanelOverty-Mac.zip"
          ditto -c -k --keepParent "dist/Creador USB Overty.app" "CreadorUSBOverty-Mac.zip"

      - name: Publicar en Releases (Mac)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Creador y Panel de Overty (última versión)"
          files: |
            PanelOverty-Mac.zip
            CreadorUSBOverty-Mac.zip
