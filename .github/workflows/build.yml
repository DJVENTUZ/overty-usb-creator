name: Compilar Creador y Panel (Overty)
on:
  push:
    branches: [main]
    paths: ["**.py", "web/**", "build/**", ".github/workflows/build.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        shell: pwsh
        run: python -m pip install --upgrade pyinstaller pywebview cryptography pillow

      - name: Iconos y versión (firma Gabriel HernArro)
        shell: pwsh
        run: |
          python build/hacer_icono.py icono_creador.ico
          python build/hacer_icono.py icono_panel.ico panel
          python build/hacer_version.py creador
          python build/hacer_version.py panel

      - name: Compilar Creador de USB
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --uac-admin `
            --name MainbitCreadorUSB --icon icono_creador.ico --version-file ver_creador.txt `
            --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import clr `
            --add-data "web;web" crear_usb.py

      - name: Compilar Panel de control
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed `
            --name PanelControlOverty --icon icono_panel.ico --version-file ver_panel.txt `
            --collect-all webview --collect-all pythonnet --collect-all clr_loader --hidden-import clr `
            --collect-all cryptography --add-data "web;web" panel_control.py

      - name: WebView2Loader.dll (firmada por Microsoft) para ambos
        shell: pwsh
        run: |
          Invoke-WebRequest -UseBasicParsing -Uri "https://www.nuget.org/api/v2/package/Microsoft.Web.WebView2/1.0.2592.51" -OutFile wv2.zip
          Expand-Archive wv2.zip -DestinationPath wv2pkg -Force
          $ld = Get-ChildItem -Recurse wv2pkg -Filter WebView2Loader.dll | Where-Object { $_.FullName -match 'x64' } | Select-Object -First 1
          Copy-Item $ld.FullName dist\MainbitCreadorUSB\_internal\WebView2Loader.dll -Force
          Copy-Item $ld.FullName dist\PanelControlOverty\_internal\WebView2Loader.dll -Force

      - name: Lanzadores .bat
        shell: pwsh
        run: |
          $lineas = @(
            '@echo off',
            'title Creador de USB Overty',
            'net session >nul 2>&1',
            'if errorlevel 1 ( powershell -NoProfile -Command "Start-Process -FilePath ''%~f0'' -Verb RunAs" & exit /b )',
            'start "" "%~dp0MainbitCreadorUSB\MainbitCreadorUSB.exe"'
          )
          Set-Content -Path "dist\MainbitCreadorUSB\CREAR_USB_OVERTY.bat" -Value $lineas -Encoding ascii

      - name: Empaquetar
        shell: pwsh
        run: |
          Copy-Item LEEME-TECNICOS.txt dist\MainbitCreadorUSB\LEEME.txt -ErrorAction SilentlyContinue
          Compress-Archive -Path dist\MainbitCreadorUSB\* -DestinationPath MainbitCreadorUSB.zip -Force
          Compress-Archive -Path dist\PanelControlOverty\* -DestinationPath PanelControlOverty.zip -Force

      - name: Publicar en Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Creador y Panel de Overty (última versión)"
          files: |
            MainbitCreadorUSB.zip
            PanelControlOverty.zip
